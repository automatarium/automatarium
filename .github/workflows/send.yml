name: Send Latest Build
on:
  push:
    branches:
      - main

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build project
        run: yarn build

      - name: Zip dist folder to send
        run: zip -r automatarium_frontend_dist.zip ./frontend/dist/

      - name: Upload dist zip to GH Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'automatarium_frontend_dist'
          path: automatarium_frontend_dist.zip

      - name: Send email with latest build
        uses: cinotify/github-action@main
        with:
          to: ${{ secrets.RMIT_LIB_EMAIL }}
          subject: 'Automatarium Latest Build'
          body: 'Hi Team, <br><br> A recent push has been made to the main branch.
                Please find the latest build of Automatarium attached. <br><br> 
                To view more about the changes, please see the commit details at
                https://github.com/automatarium/automatarium/commit/${{ github.sha }}. <br><br>
                Best Regards, <br> Automatarium CI System'
          type: 'text/html'
          attachment: 'automatarium_frontend_dist.zip'
