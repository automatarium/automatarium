name: Send Latest Build
on:
  push:
    branches:
      - dev # change to main

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build project
        run: yarn build

      - name: Zip dist folder
        uses: actions/upload-artifact@v4
        with:
          name: 'automatarium_dist'
          path: ./frontend/dist/

      - name: Download zip
        uses: actions/download-artifact@v5
        with:
          name: 'automatarium_dist'

      - name: Run Get Email Action
        id: get_email
        uses: ryohidaka/action-get-email@v0.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - uses: cinotify/github-action@main
        with:
          to: ${{ steps.get_email.outputs.email }}
          subject: 'Automatarium Latest Build'
          body: 'Hi Team, <br><br> Please find the latest build of Automatarium attached. <br><br> Best Regards, <br> Automatarium CI System'
          type: 'text/html'
          attachment: 'automatarium_dist.zip'