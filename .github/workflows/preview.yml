name: Deploy PR previews
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set PR preview env variable
        shell: bash
        run: echo 'PR_PREVIEW=pr-preview/pr-${{ github.ref }}' >> .env

      - uses: ./.github/actions/setup

      - name: Install Yarn Dependencies and build project
        if: github.event.action != 'closed'
        run: yarn build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1.6.2
        with:
          source-dir: ./frontend/dist/